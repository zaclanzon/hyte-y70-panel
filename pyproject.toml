[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyte-panel"
version = "0.1.0"
description = "Touch panel dashboard for the HYTE Y70 Touch case screen on Ubuntu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.535"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hyte-panel = "hyte_panel.__main__:main"

[tool.setuptools.packages.find]
include = ["hyte_panel*"]

[tool.setuptools.package-data]
hyte_panel = ["static/*", "static/ca/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
