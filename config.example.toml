# hyte-panel configuration.
# Copy this file to ~/.config/hyte-panel/config.toml and edit the values.

[server]
host = "127.0.0.1"      # Keep 127.0.0.1. The panel can launch programs.
port = 8787
refresh_seconds = 1.0   # Hardware sample interval

[display]
# HYTE Y70 Touch: 720 x 2560 (portrait). HYTE Y70 Touch Infinite: 1100 x 3840.
width = 720
height = 2560
connector = ""          # Optional connector name, for example "DP-3". Empty = detect by size.
backend = "auto"        # auto | gtk | chromium
chromium = ""           # Optional path to a Chromium/Chrome binary for the chromium backend
dim_after_seconds = 0   # 0 = never dim. Otherwise dim the panel after this idle time.

[weather]
enabled = true
label = "Sydney"
latitude = -33.87
longitude = 151.21
units = "metric"        # metric | imperial
refresh_minutes = 15

[hardware]
gpu = true
disks = ["/"]
network_interface = ""  # Empty = sum of all interfaces

[agents]
enabled = true
scan_processes = true
# Process names that count as AI agents. Matched against the executable name
# and the first script argument (for example "node .../claude").
process_patterns = ["claude", "codex", "aider", "gemini", "cursor-agent", "copilot", "goose"]
stale_seconds = 900     # Hide hook-reported agents with no events for this long

[theme]
# Accent colors follow the rgb-runway lighting config (base_color -> primary,
# stripe_color -> secondary). Warnings use a blend of the two. The panel
# re-reads the file whenever it changes, so the screen switches with the LEDs.
follow_runway = true
runway_config = ""      # Empty = ~/.config/rgb-runway.json
primary = [255, 0, 0]   # Fallbacks when the file is missing or follow_runway = false
secondary = [0, 0, 255]

[automata]
# Cellular automata card. Stands where the app buttons card was.
enabled = true
rule = "life"               # starting rule: life, highlife, brain, rule30, cyclic, ... (see static/ca/core.js)
cell = 2                    # device pixels per cell
attract_idle_seconds = 45   # rotate rules after this idle time; 0 = never
attract_rotate_seconds = 120
reactive = true             # CPU load, network traffic and agent activity feed the world

# App buttons. Use "desktop_id" for installed apps (gtk-launch), or "command".
# The apps card is currently replaced by the automata card; the launch endpoint
# still works and the config is kept for when the card comes back.
[[apps]]
name = "Terminal"
icon = "terminal"
desktop_id = "org.gnome.Terminal"

[[apps]]
name = "Files"
icon = "folder"
desktop_id = "org.gnome.Nautilus"

[[apps]]
name = "Firefox"
icon = "globe"
desktop_id = "firefox_firefox"

[[apps]]
name = "VS Code"
icon = "code"
desktop_id = "code"

[[apps]]
name = "Steam"
icon = "gamepad"
desktop_id = "steam"

[[apps]]
name = "Monitor"
icon = "activity"
desktop_id = "org.gnome.SystemMonitor"

[[apps]]
name = "Settings"
icon = "settings"
desktop_id = "org.gnome.Settings"

[[apps]]
name = "Lock"
icon = "lock"
command = "loginctl lock-session"
